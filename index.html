<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aungaing's Secret Quest 💗</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FFF0F5 0%, #F3E5F5 50%, #E8EAF6 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.9);
      --primary-pink: #FF80AB;
      --deep-pink: #FF4081;
      --text-main: #4A4A4A;
      --text-muted: #888888;
      --accent-purple: #B388FF;
      --shadow-soft: 0 10px 30px rgba(255, 128, 171, 0.15);
      --radius-lg: 24px;
      --radius-btn: 50px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 16px;
    }

    html {
      height: -webkit-fill-available;
    }

    .bg-decorations {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-item {
      position: absolute;
      opacity: 0.25;
      animation: floatAround 12s infinite ease-in-out;
    }

    @keyframes floatAround {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    #app-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 750px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px;
      z-index: 1;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .progress-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 128, 171, 0.15);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-pink), var(--accent-purple));
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .content-viewport {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 12px 0;
      position: relative;
    }

    .screen-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8deg); }
      to { opacity: 1; transform: translateY(0); }
    }

    .character-avatar {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06));
      animation: gentlePulse 3s infinite ease-in-out;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .story-card-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 128, 171, 0.2);
      border-radius: 18px;
      padding: 20px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .story-text {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-line;
      word-break: break-word;
      font-weight: 500;
    }

    .input-wrapper {
      width: 100%;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quest-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 128, 171, 0.4);
      background: rgba(255, 255, 255, 0.9);
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      text-align: center;
      transition: all 0.25s ease;
    }

    .quest-input:focus {
      border-color: var(--deep-pink);
      box-shadow: 0 0 0 3px rgba(255, 64, 129, 0.15);
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .button-area {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 8px;
    }

    .btn-action {
      width: 100%;
      max-width: 280px;
      padding: 14px 28px;
      border: none;
      border-radius: var(--radius-btn);
      background: linear-gradient(135deg, var(--primary-pink), var(--deep-pink));
      color: white;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 64, 129, 0.3);
      transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .btn-action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .toast-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .toast-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .toast-box {
      background: white;
      padding: 24px 28px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 80%;
    }

    .toast-overlay.active .toast-box {
      transform: scale(1);
    }

    .toast-icon { font-size: 40px; margin-bottom: 8px; }
    .toast-title { font-size: 18px; font-weight: 700; color: var(--text-main); }

    .final-screen {
      gap: 12px;
    }

    .final-heart {
      font-size: 72px;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }

    .final-signature {
      font-size: 18px;
      font-weight: 700;
      color: var(--deep-pink);
      margin-top: 10px;
    }
  </style>
</head>

    let currentIndex = 0;
    let isTransitioning = false;

    function loadProgress() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved !== null) {
          const parsed = parseInt(saved, 10);
          if (!isNaN(parsed) && parsed >= 0 && parsed < screens.length) {
            currentIndex = parsed;
          }
        }
      } catch (e) {
        console.warn("localStorage error:", e);
      }
    }

    function saveProgress(index) {
      try {
        localStorage.setItem(STORAGE_KEY, index.toString());
      } catch (e) {
        console.warn("save error:", e);
      }
    }

    function resetQuest() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {
        console.warn("clear error:", e);
      }
      currentIndex = 0;
      renderScreen();
    }

    function checkAnswer(inputVal, validAnswers) {
      const value = normalize(inputVal);
      if (!value) return false;
      return validAnswers.some(a => {
        const key = normalize(a);
        return key && value.includes(key);
      });
    }

    function showToast(icon, title, callback) {
      const overlay = document.getElementById('toast-overlay');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-title').textContent = title;

      overlay.classList.add('active');
      setTimeout(() => {
        overlay.classList.remove('active');
        if (callback) callback();
      }, 1400);
    }

    function renderScreen() {
      const current = screens[currentIndex];
      const viewport = document.getElementById('content-viewport');
      const buttonArea = document.getElementById('button-area');
      const progressText = document.getElementById('progress-text');
      const progressFill = document.getElementById('progress-fill');

      const pageNum = currentIndex + 1;
      progressText.textContent = `${pageNum} / ${screens.length}`;
      progressFill.style.width = `${(pageNum / screens.length) * 100}%`;

      viewport.innerHTML = '';

      viewport.appendChild(card);

        btn.className = 'btn-action';

        btn.addEventListener('click', () => handleNext(current));
        buttonArea.appendChild(btn);

        if (current.type === 'question') {

          if (input) {
            input.addEventListener('keypress', (e) => {
              if (e.key === 'Enter') handleNext(current);
            });
          }
        }
      }
    }
