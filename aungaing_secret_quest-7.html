<style>
:root{
  --bg1:#fff9f4; --bg2:#f9f1ff; --ink:#5b4b5f; --muted:#927f91;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:ui-rounded,"Hiragino Sans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
body{
  min-height:100svh; overflow-x:hidden;
  background:

    linear-gradient(145deg,var(--bg1),var(--bg2));
}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{min-height:100svh;display:flex;justify-content:center;padding:14px 12px 24px}
.shell{width:min(100%,520px);min-height:calc(100svh - 38px);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:5px 5px 12px}
.brand{font-size:12px;letter-spacing:.12em;color:#a4869a;white-space:nowrap}
.progress{height:7px;flex:1;background:rgba(255,255,255,.72);border:1px solid rgba(200,170,193,.18);border-radius:99px;overflow:hidden;box-shadow:0 3px 12px rgba(90,60,90,.05)}
.bar{height:100%;width:0;background:linear-gradient(90deg,#f2a8c5,#cdb8ef);border-radius:99px;transition:width .45s ease}
.count{font-size:12px;color:#a4869a;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{width:100%;position:relative;padding:26px 20px 22px;border:1px solid rgba(255,255,255,.75);border-radius:30px;background:rgba(255,252,248,.77);backdrop-filter:blur(14px);box-shadow:var(--shadow);text-align:center;overflow:hidden}
.card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,215,231,.35);right:-90px;top:-100px;filter:blur(4px)}
.card:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(218,202,250,.3);left:-90px;bottom:-100px}
.decor{font-size:39px;line-height:1;margin:0 0 14px;filter:drop-shadow(0 8px 10px rgba(90,60,90,.08));position:relative;z-index:1}
.kicker{font-size:12px;letter-spacing:.15em;color:#ad8da4;margin-bottom:10px;position:relative;z-index:1}
h1,h2,p{position:relative;z-index:1}
h1{font-size:clamp(28px,8vw,43px);line-height:1.15;margin:0 0 13px;color:#6b5266}
h2{font-size:clamp(22px,6.2vw,31px);line-height:1.3;margin:0 0 14px;color:#6b5266}
.story{font-size:16px;line-height:1.95;margin:0 auto;max-width:420px;white-space:pre-line}
.small{font-size:13px;color:var(--muted);line-height:1.8}
.note{margin:18px auto 0;padding:14px 15px;border-radius:20px;background:rgba(255,255,255,.66);border:1px solid rgba(236,198,217,.55);font-size:14px;line-height:1.8;max-width:410px}
.actions{position:relative;z-index:2;margin-top:22px}
.next,.submit{
  border:0;border-radius:18px;padding:14px 22px;min-height:50px;width:min(100%,320px);
  color:#fff;background:linear-gradient(135deg,#e99dbd,#bda8e7);
  box-shadow:0 10px 24px rgba(189,130,166,.22);font-weight:700;font-size:15px;
  transition:transform .15s ease,filter .15s ease,opacity .15s ease;
}
.next:active,.submit:active{transform:scale(.97)}
.next:disabled,.submit:disabled{opacity:.55;cursor:default}
.input{width:100%;max-width:390px;border:1px solid #ead5df;background:rgba(255,255,255,.82);border-radius:17px;padding:15px 16px;outline:none;color:var(--ink);font-size:16px;text-align:center;box-shadow:inset 0 2px 8px rgba(100,70,100,.04)}
.input:focus{border-color:#dcaac3;box-shadow:0 0 0 4px rgba(238,159,189,.13)}
.question{margin-top:12px}
.hint{font-size:12px;color:#aa8d9f;margin-top:10px}
.unlock{display:inline-flex;align-items:center;gap:8px;margin:17px auto 0;padding:10px 15px;border-radius:999px;background:#fff0f5;color:#a86d8c;font-size:13px}
.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;opacity:.65;animation:float 5s ease-in-out infinite}
.f1{left:8%;top:12%;animation-delay:.3s}.f2{right:8%;top:25%;animation-delay:1.1s}.f3{left:14%;bottom:13%;animation-delay:2s}.f4{right:15%;bottom:18%;animation-delay:1.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(6deg)}}
.enter{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
.pulse{animation:pulse .7s ease}
@keyframes pulse{50%{transform:scale(1.04)}}
.wrong{animation:shake .35s ease}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.heart-big{font-size:80px;line-height:1;margin:5px 0 15px;animation:heart 1.8s ease-in-out infinite}
@keyframes heart{50%{transform:scale(1.09)}}
.final .card{padding-top:34px;padding-bottom:32px;background:linear-gradient(150deg,rgba(255,250,244,.92),rgba(255,235,246,.84))}
.final h1{font-size:clamp(31px,9vw,48px)}
.letter{text-align:left;max-width:430px;margin:0 auto;font-size:15px;line-height:2.05}
.letter p{margin:0 0 15px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-style:normal;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(520deg);opacity:0}}
@media (max-height:680px){
  .app{padding-top:7px}.card{padding:20px 17px}.decor{font-size:31px;margin-bottom:9px}
  .story{font-size:14px;line-height:1.75}.actions{margin-top:15px}.note{margin-top:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

}
function save(){
  try{localStorage.setItem(KEY,String(state.screen));}catch(e){}
}
function load(){
  try{
    const n=parseInt(localStorage.getItem(KEY)||"1",10);
    state.screen=(Number.isInteger(n)&&n>=1&&n<=68)?n:1;
  }catch(e){state.screen=1;}
}
function resetQuest(){
  try{localStorage.removeItem(KEY);}catch(e){}
  state.screen=1; state.busy=false; render();
}
function confetti(){
  const box=document.getElementById("confetti");
  box.innerHTML="";
  const chars=["💗","✨","🌸","♡","🎀"];
  for(let i=0;i<20;i++){
    const el=document.createElement("i");
    el.textContent=chars[i%chars.length];
    el.style.left=(Math.random()*100)+"%";
    el.style.animationDelay=(Math.random()*.35)+"s";
    el.style.fontSize=(12+Math.random()*12)+"px";
    box.appendChild(el);
  }
  setTimeout(()=>box.innerHTML="",2200);
}
function next(){
  if(state.busy||state.screen>=68)return;
  state.busy=true;
  const btn=document.querySelector(".next");
  if(btn)btn.disabled=true;
  setTimeout(()=>{
    state.screen++;
    save(); state.busy=false; render();
  },420);
}
function submitAnswer(){
  if(state.busy)return;
  const p=screens[state.screen-1], input=document.getElementById("answer");
  const value=normalize(input?.value);
  if(!value){
    input?.focus();
    showMessage("先写一个答案给我吧 ♡",false);
    return;
  }
  state.busy=true;
  const ok=questions[p.q].answers.some(a=>{
    const key=normalize(a);
    return key && value.includes(key);
  });
  const card=document.querySelector(".card");
  if(ok){
    if(card)card.classList.add("pulse");
    confetti();
    setTimeout(()=>{
      state.screen++;
      save(); state.busy=false; render();
    },650);
  }else{
    if(card)card.classList.add("wrong");
    showMessage("答错了……🥺",true);
    setTimeout(()=>resetQuest(),950);
  }
}
function showMessage(msg,wrong){
  let el=document.querySelector(".hint");
  if(!el){
    el=document.createElement("div");
    el.className="hint";
    document.querySelector(".actions")?.appendChild(el);
  }
  el.textContent=msg;
  el.style.color=wrong?"#c67d9d":"#aa8d9f";
}
function render(){
  const p=screens[state.screen-1];
  const app=document.getElementById("app");
  const pct=(state.screen/68)*100;
  const final=p.type==="final"?" final":"";
  let body="";
  if(p.type==="question"){
    body=`
      <div class="decor">${p.decor}</div>
      <div class="kicker">${p.kicker}</div>
      <h2>${p.title}</h2>
      <p class="story">${p.text}</p>
      <div class="question">
        <input id="answer" class="input" autocomplete="off" inputmode="text" enterkeyhint="done" placeholder="${p.placeholder}" aria-label="答案">
      </div>
      <div class="actions"><button class="submit" id="submit">${p.button}</button><div class="hint">${p.hint}</div></div>`;
  }else if(p.type==="letter"){
    body=`
      <div class="decor">${p.decor}</div><div class="kicker">${p.kicker}</div>
      <h2>${p.title}</h2>
      <div class="letter">
        <p>谢谢你，宝宝。</p>
        <p>谢谢你来到我的生命里。</p>
        <p>也谢谢你成为我现在很珍惜的人。</p>
        <p>虽然我们认识的时间还不算很长……<br>但是你已经变成了我会期待的人。</p>
      </div>
      <div class="actions"><button class="next">${p.button}</button></div>`;
  }else if(p.type==="letter2"){
    body=`
      <div class="decor">${p.decor}</div><div class="kicker">${p.kicker}</div>
      <h2>${p.title}</h2>
      <div class="letter">
        <p>我希望以后的很多很多天，我身边的人还是你。</p>
        <p>如果我偶尔任性、想太多……<br>请再给我一点点耐心。</p>
        <p>我也会努力。<br>努力好好珍惜你。<br>努力成为更好的女朋友。</p>
      </div>
      <div class="actions"><button class="next">${p.button}</button></div>`;
  }else if(p.type==="letter3"){
    body=`
      <div class="decor">${p.decor}</div><div class="kicker">${p.kicker}</div>
      <h2>${p.title}</h2>
      <div class="letter">
        <p>最后一点点路，我想和你一起走完。</p>
        <p>谢谢你一直看到这里。</p>
      </div>
      <div class="actions"><button class="next">${p.button}</button></div>`;
  }else if(p.type==="final"){
    body=`
      <div class="heart-big">💗</div>
      <div class="decor">${p.decor}</div>
      <div class="kicker">${p.kicker}</div>
      <h1>${p.title}</h1>
      <p class="story">${p.text}</p>`;
  }else{
    body=`
      <div class="decor">${p.decor}</div>
      <div class="kicker">${p.kicker}</div>
      <h2>${p.title}</h2>
      <p class="story">${p.text}</p>
      ${p.note?`<div class="note">${p.note}</div>`:""}
      <div class="actions"><button class="next">${p.button}</button></div>`;
  }
  app.innerHTML=`
    <header class="top">
      <div class="brand">AUNGAING · SECRET QUEST</div>
      <div class="progress" aria-label="进度"><div class="bar" style="width:${pct}%"></div></div>
      <div class="count">${state.screen} / 68</div>
    </header>
    <section class="stage${final}">
      <div class="sparkles" aria-hidden="true">
        <span class="float f1">♡</span><span class="float f2">✦</span><span class="float f3">✿</span><span class="float f4">♡</span>
      </div>
      <article class="card enter">${body}</article>
    </section>`;
  const nextBtn=document.querySelector(".next");
  if(nextBtn) nextBtn.addEventListener("click",next);
  const submit=document.getElementById("submit");
  const input=document.getElementById("answer");
  if(submit){
    submit.addEventListener("click",submitAnswer);
    input?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submitAnswer();}});
    setTimeout(()=>input?.focus(),180);
  }
  if(state.screen===68){
    confetti();
  }
}
load();
render();

/* Self-check: exactly 68 entries and required question positions. */
console.assert(screens.length===68,"Quest must contain exactly 68 screens.");
console.assert(screens[17].type==="question" && screens[17].q===1,"Q1 must be screen 18.");
console.assert(screens[34].type==="question" && screens[34].q===2,"Q2 must be screen 35.");
console.assert(screens[46].type==="question" && screens[46].q===3,"Q3 must be screen 47.");
console.assert(screens[56].type==="question" && screens[56].q===4,"Q4 must be screen 57.");
</script>
</body>
</html>
